apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-postgres
  labels:
    app: dev-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dev-postgres
  template:
    metadata:
      labels:
        app: dev-postgres
    spec:
      containers:
      - name: dev-postgres
        image: postgres:15
        env:
          - name: POSTGRES_USER
            value: testuser
          - name: POSTGRES_PASSWORD
            value: testpass
          - name: POSTGRES_DB
            value: newbank
        ports:
          - containerPort: 5432
        volumeMounts:
          - mountPath: /var/lib/postgresql/data
            name: postgres-data
      volumes:
        - name: postgres-data
          emptyDir: {}
